<!-- 測試夾具:模擬 viewer(spine_inspector.html)端的 postMessage 契約。
     validate_motion_tools.py 的 A8 用它證明「viewer ⇄ 編輯器」這條線真的通:
       harness --(spine-motion/load)--> 編輯器 --(spine-motion/preview)--> harness
     這裡刻意不載入 spine-webgl(CDN 被政策擋),只驗訊息契約與 keys 內容。 -->
<meta charset="utf-8"><title>bridge harness</title>
<style>body{margin:0;font:12px system-ui;background:#0e1016;color:#ccd}iframe{width:100%;height:92vh;border:0}</style>
<div id="s">harness ready</div>
<iframe id="f" src="../../spine_trajectory_editor.html"></iframe>
<script>
window.__preview = null;
window.__loaded = false;
document.getElementById('f').onload = () => { window.__loaded = true; };
window.sendLoad = (skeleton, animation, bone, body) => {
  document.getElementById('f').contentWindow.postMessage(
    {type:'spine-motion/load', skeleton, animation, bone, body, name:'(harness)'}, '*');
  return true;
};
window.addEventListener('message', ev => {
  const m = ev.data || {};
  if (m.type === 'spine-motion/preview') {
    window.__preview = m;
    document.getElementById('s').textContent = '收到 preview:' + m.bone + ' @ ' + m.animation + ' · ' + m.keys.length + ' keys';
  }
});
</script>
